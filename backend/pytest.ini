[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: smoke tests rápidos (read-only, sin escribir en BD)
    unit: tests unitarios (sin BD)
    integration: tests de integración API (pueden escribir en BD)
    regression: tests de regresión end-to-end (flujos completos)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -v --tb=short --strict-markers
