name: CI

on:
  push:
    branches: [main, clean_main_v3]
  pull_request:
    branches: [main, clean_main_v3]

permissions:
  contents: read

jobs:
  # ── Backend Python ───────────────────────────────────────────────────────
  backend:
    name: Backend (pytest + audit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_arepaserp
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ArepasERP
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app_arepaserp -d ArepasERP"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pip-audit bandit

      - name: Apply schema
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U app_arepaserp -d ArepasERP -f database/schema.sql || true
          # Aplica migraciones en orden (best effort)
          for f in database/migration_*.sql; do
            echo "Aplicando $f"
            psql -h localhost -U app_arepaserp -d ArepasERP -f "$f" || true
          done

      - name: Run pytest
        working-directory: backend
        env:
          DB_USER:    app_arepaserp
          DB_PASS:    ci_test_password
          DB_HOST:    localhost
          DB_PORT:    '5432'
          DB_NAME:    ArepasERP
          DB_SSLMODE: disable
          SECRET_KEY: ci_test_secret_key_do_not_use_in_prod
          DEBUG:      'false'
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: pip-audit (vulnerabilidades de dependencias)
        working-directory: backend
        continue-on-error: true   # No-bloqueante hasta que se resuelvan las P0
        run: pip-audit --requirement requirements.txt --strict

      - name: Bandit (SAST)
        working-directory: backend
        continue-on-error: true   # No-bloqueante en el primer roll-out
        run: bandit -r . -ll --exclude ./venv,./tests

  # ── Frontend React/Vite ──────────────────────────────────────────────────
  frontend:
    name: Frontend (vitest + audit + lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: npm audit (vulnerabilidades de dependencias)
        working-directory: frontend
        continue-on-error: true   # No-bloqueante hasta que se resuelvan los CVEs de axios
        run: npm audit --audit-level=high
